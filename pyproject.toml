[project]
name = "strawberry-crab"
version = "0.1.1"
description = "Strawberry, a local desktop AI mascot: the daemon, the doorways, the tray icon and the CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["desktop", "mascot", "assistant", "ollama", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "aiohttp>=3.10",
    "faster-whisper>=1.2.1",
    "jeepney>=0.9.0; sys_platform == 'linux'",
    "mcp>=1.2",
    "numpy>=1.26",
    "piper-tts>=1.8.0",
    # The microphone on Windows: WASAPI through PortAudio (voice.py); its wheels carry PortAudio.
    # Linux records with pw-record.
    "sounddevice>=0.5; sys_platform == 'win32'",
    # Media on Windows: the System Media Transport Controls (smtc.py, doorways/smtc_watch.py).
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    # Notifications on Windows: other apps' toasts (doorways/toast_watch.py). ApplicationModel
    # carries the app's name and logo, Storage.Streams reads the logo's bytes.
    "winrt-Windows.ApplicationModel>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.2; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management>=3.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The same wheels as the `gpu` group, for `uv tool install 'strawberry-crab[gpu]'` (groups are not
# published). ctranslate2 needs them for whisper on CUDA (WIRING.md §7, voice.preload_cuda_libraries).
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
]

[project.urls]
Homepage = "https://github.com/panuhen/strawberry"
Changelog = "https://github.com/panuhen/strawberry/blob/main/CHANGELOG.md"
Issues = "https://github.com/panuhen/strawberry/issues"

[project.scripts]
strawberry = "strawberry_crab.cli:main"
strawberryd = "strawberry_crab.strawberryd:main"
strawberry-doorway = "strawberry_crab.doorways:main"

[project.gui-scripts]
# `strawberry tray` without a console window: what the Windows Startup shortcut runs (startup.py).
# Elsewhere it is the same as `strawberry tray`.
strawberry-tray = "strawberry_crab.cli:tray_main"

[dependency-groups]
dev = [
    # The D-Bus doorway and tray tests build their messages with jeepney on every system.
    "jeepney>=0.9.0",
    "pillow>=12.3.0",
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strawberry_crab"]

[tool.hatch.build.targets.sdist]
# The Python package and what builds or checks it; the Godot project and the Blender sources
# (widget/, model/) ship as the widget binary instead (PACKAGING.md step 4).
include = ["/src/strawberry_crab", "/tests", "/scripts", "/README.md", "/LICENSE", "/THIRD_PARTY.md", "/CHANGELOG.md", "/WIRING.md", "/PACKAGING.md", "/ADAPTERS.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `from tests.fake_spotify import ...` works under a bare `pytest` too, not only `python -m pytest`.
pythonpath = ["."]
markers = [
    "linux_only: needs Linux (D-Bus, systemd, POSIX signals or processes); skipped elsewhere (tests/conftest.py)",
]
