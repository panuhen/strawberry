[project]
name = "strawberryd"
version = "0.1.0"
description = "Strawberry mascot daemon: event intake, brain, TTS, and the single websocket to the Godot widget"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "faster-whisper>=1.2.1",
    "mcp>=1.2",
    "piper-tts>=1.8.0",
]

[project.scripts]
strawberryd = "strawberryd.__main__:main"

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strawberryd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
