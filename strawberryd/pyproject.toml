[project]
name = "strawberryd"
version = "0.1.0"
description = "Strawberry mascot daemon: event intake, brain, TTS, and the single websocket to the Godot widget"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
strawberryd = "strawberryd.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strawberryd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
