; The widget as one standalone binary per system (PACKAGING.md step 4, WIRING.md §13):
; "Linux" and "Windows". Built by scripts/build_widget.sh, which stamps
; application/config/version into a staging copy of the project and exports one preset
; headless; export_path is overridden there.
;
; export_filter "all_resources" takes every scene, script, shader and the GLB. The validators
; (validate_*.gd) are resources too and stay in: they let the exported binary run the headless
; acceptance (`<binary> --headless -- --acceptance=res://validate_widget.gd`, scripts/check_phase1.sh
; with WIDGET=<binary>). desktop_idle.py is not a resource, so include_filter adds it; the
; sleep controller copies it out of the pack to run it with Python (paths.gd python()).
;
; Windows: the .exe's own icon is the berry (application/icon, converted to .ico by the export),
; which Explorer, the taskbar and Task Manager show; the window sets the same one at run time
; (config/icon). No console wrapper: the tray starts it windowless. The file and product version
; come from the stamped config/version.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="desktop_idle.py"
exclude_filter="*.md"
export_path="../dist/strawberry-widget-linux-x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="desktop_idle.py"
exclude_filter="*.md"
export_path="../dist/strawberry-widget-windows-x86_64.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
