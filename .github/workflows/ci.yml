# Tests and a package build on every push to main and every pull request. No GPU wheels, no
# Ollama, no session bus: tests/conftest.py keeps the tests off the desktop.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes no moving major tag
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv build
