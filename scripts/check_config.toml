# Settings for the acceptance scripts: canned reactions so the expected lines are
# deterministic. The model path has its own unit tests (tests/test_brain.py).
[brain]
enabled = false

[voice]
enabled = false   # no microphone or whisper model in the acceptance run; tests/test_voice.py covers the flow

[gate]
enabled = false   # no Ollama in the acceptance run; tests/test_systemone.py covers the gate

[tools]
enabled = false   # no MCP servers in the acceptance run; tests/test_tools.py covers the client

[actions]
mpris = false     # the acceptance run must not touch whatever is playing on the machine

[thinker]
enabled = false   # no Qwen in the acceptance run; tests/test_thinker.py covers the loop
